services:
  product-catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ""
      MYSQL_HOST: catalog-mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shopease_product_catalog_db}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      JWT_PUBLIC_KEY_FILE: /run/secrets/auth_jwt_public_key
      JWT_ALGORITHM: RS256
      LOW_STOCK_THRESHOLD: ${LOW_STOCK_THRESHOLD:-10}
    ports:
      - "8005:8000"
    depends_on:
      catalog-mysql:
        condition: service_healthy
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    networks:
      - catalog-network
    secrets:
      - auth_jwt_public_key

  catalog-mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shopease_product_catalog_db}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - catalog-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --protocol=TCP --host=127.0.0.1 --port=3306 --user=root --password="$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - catalog-network

volumes:
  catalog-mysql-data:

secrets:
  auth_jwt_public_key:
    file: ${JWT_PUBLIC_KEY_FILE:?Set JWT_PUBLIC_KEY_FILE in .env}

networks:
  catalog-network:
    driver: bridge
